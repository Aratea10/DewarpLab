[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dewarplab"
version = "0.1.0"
description = "Interactive document dewarping tool with automatic detection and manual mesh editing."
requires-python = ">=3.14,<3.15"
dependencies = [
    "PySide6==6.11.2",
]

[tool.setuptools.packages.find]
where = ["src"]
